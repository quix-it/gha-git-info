name: Get git info with composite action
description: Get and manipulate info from github context.

inputs:
  quiet:
    description: Skip printing gathered info.
    required: false
    default: 'false'
  artifact_always:
    description: Always makes `make_artifact` output `true` (overrides ARTIFACT_ALWAYS environment variable).
    required: false
  artifact_events:
    description: Comma-separated list of events that make `make_artifact` output `true` (overrides ARTIFACT_EVENTS environment variable). Push tag event is always included.
    required: false
  nexus_base_path:
    description: Base URL to Sonatype Nexus artifact storage (overrides NEXUS_BASE_PATH environment variable).
    required: false
  maven_group_id:
    description: Maven group ID (overrides MAVEN_GROUP_ID environment variable).
    required: false
  maven_artifact_id:
    description: Maven artifact ID (overrides MAVEN_ARTIFACT_ID environment variable).
    required: false
  maven_extension:
    description: Maven artifact extension to search for (overrides MAVEN_EXTENSION environment variable).
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Git
      shell: bash 
      run: | 
        sudo apt-get update 
        sudo apt-get install -y git jq

    - name: get github info
      shell: bash
      id: getinfo
      run: | 
        EVENT_NAME=${{ github.event_name }}
        SHA=${{ github.sha }}
        REF=${{ github.ref }}
        REPO_NAME=${{ github.repository }}
        ARTIFACT_ALWAYS=${{ inputs.artifact_always }}
        ARTIFACT_EVENTS=${{ inputs.artifact_events }}
        QUIET=${{ inputs.quiet }}

        TAG=$(echo "$REF" | grep -oP '^refs/tags/\K.*')
        BRANCH=$(echo "$REF" | grep -oP '^refs/heads/\K.*')

        if [ "$EVENT_NAME" == "push" ]; then
          if [ -n "$BRANCH" ]; then
            BRANCH_NAME=$BRANCH
          fi
        elif [ "$EVENT_NAME" == "pull_request" ]; then
          SHA=$(jq -r .pull_request.head.sha < $GITHUB_EVENT_PATH)
          BRANCH_NAME=$GITHUB_HEAD_REF
        fi

        BRANCH_UNSLASHED=$(echo "$BRANCH_NAME" | sed 's/[\/_]/-/g')
        SHA_SHORT=$(echo "$SHA" | cut -c1-7)
        REPO_NAME=$(jq -r .repository.name < $GITHUB_EVENT_PATH)

        echo "event_name=$EVENT_NAME" >> $GITHUB_OUTPUT
        echo "sha=$SHA" >> $GITHUB_OUTPUT
        echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "is_tag=$IS_TAG" >> $GITHUB_OUTPUT
        echo "make_artifact=$MAKE_ARTIFACT" >> $GITHUB_OUTPUT
        echo "revision=$REVISION" >> $GITHUB_OUTPUT
        echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "branch_unslashed=$BRANCH_UNSLASHED" >> $GITHUB_OUTPUT
        echo "repository_name=$REPO_NAME" >> $GITHUB_OUTPUT
        echo "maven_revision=$MAVEN_REVISION" >> $GITHUB_OUTPUT
        echo "artifact_revision=$ARTIFACT_REVISION" >> $GITHUB_OUTPUT
        echo "nexus_repo=$NEXUS_REPO" >> $GITHUB_OUTPUT
      